<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Azure DevOps run</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--orca-background);
        color: var(--orca-foreground);
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      #app { display: flex; flex-direction: column; height: 100vh; }
      [hidden] { display: none !important; }
      .muted { color: var(--orca-muted-foreground); }
      .grow { margin-right: auto; }
      .pad { margin: 16px 12px; }
      button, input, textarea { font: inherit; color: inherit; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, .log-scroller:focus-visible {
        outline: 2px solid var(--orca-ring);
        outline-offset: 1px;
      }
      .button {
        border: 0;
        border-radius: var(--orca-radius);
        padding: 5px 12px;
        background: var(--orca-primary);
        color: var(--orca-primary-foreground);
        cursor: pointer;
        white-space: nowrap;
      }
      .button.secondary { background: var(--orca-secondary); color: var(--orca-secondary-foreground); }
      .button.danger { background: var(--orca-destructive); color: var(--orca-destructive-foreground); }
      .button.small { padding: 2px 8px; font-size: 12px; }
      .button:disabled { opacity: 0.5; cursor: default; }
      .link {
        border: 0;
        padding: 0;
        background: none;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        overflow-wrap: anywhere;
      }
      .link:hover { text-decoration: underline; }
      .toggle {
        border: 1px solid var(--orca-input);
        border-radius: var(--orca-radius);
        background: transparent;
        padding: 2px 10px;
        cursor: pointer;
      }
      .toggle[aria-pressed='true'] { background: var(--orca-secondary); color: var(--orca-secondary-foreground); }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--orca-border);
      }
      .heading { display: flex; flex-direction: column; min-width: 0; }
      .title { font-weight: 600; overflow-wrap: anywhere; }
      .badge { padding: 0 8px; border: 1px solid var(--orca-border); border-radius: 10px; font-size: 12px; white-space: nowrap; }
      .badge.success { border-color: var(--orca-primary); }
      .badge.accent { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .badge.warning { border-color: var(--orca-accent); background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .badge.danger { border-color: var(--orca-destructive); color: var(--orca-destructive); }

      .banner {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 12px 0;
        padding: 8px 10px;
        border-radius: var(--orca-radius);
        background: var(--orca-secondary);
        color: var(--orca-secondary-foreground);
      }
      .banner.danger { background: var(--orca-destructive); color: var(--orca-destructive-foreground); }
      .banner.warning { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .banner span { flex: 1; overflow-wrap: anywhere; }
      .note { margin: 6px 12px 0; }

      .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .stages {
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        overflow-x: auto;
        border-bottom: 1px solid var(--orca-border);
      }
      .stage, .job, .step {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid transparent;
        border-radius: var(--orca-radius);
        background: transparent;
        text-align: left;
      }
      .stage {
        flex: none;
        padding: 4px 10px;
        border-color: var(--orca-border);
        background: var(--orca-card);
        color: var(--orca-card-foreground);
        cursor: pointer;
        white-space: nowrap;
      }
      .stage[aria-pressed='true'], .job[aria-pressed='true'], .step[aria-pressed='true'] {
        border-color: var(--orca-ring);
        background: var(--orca-accent);
        color: var(--orca-accent-foreground);
      }
      .glyph { width: 1em; text-align: center; }
      .state-succeeded > .glyph { color: var(--orca-primary); }
      .state-failed > .glyph { color: var(--orca-destructive); }
      .state-running > .glyph, .state-waiting > .glyph, .state-warning > .glyph { color: var(--orca-ring); }
      .state-pending > .glyph, .state-skipped > .glyph, .state-canceled > .glyph { color: var(--orca-muted-foreground); }

      .approvals { display: flex; flex-direction: column; gap: 6px; padding: 0 12px; }
      .approvals:empty { display: none; }
      .approval {
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid var(--orca-accent);
        border-radius: var(--orca-radius);
        background: color-mix(in srgb, var(--orca-accent) 35%, transparent);
      }
      .approval p { margin: 0 0 6px; overflow-wrap: anywhere; }
      .approval p:last-child { margin: 6px 0 0; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .comment {
        display: block;
        width: 100%;
        margin-bottom: 6px;
        padding: 4px 6px;
        resize: vertical;
        border: 1px solid var(--orca-input);
        border-radius: var(--orca-radius);
        background: var(--orca-background);
      }

      .split { flex: 1; min-height: 0; display: flex; }
      .steps {
        flex: none;
        width: 280px;
        overflow: auto;
        padding: 8px;
        border-right: 1px solid var(--orca-border);
      }
      .step-list { display: flex; flex-direction: column; gap: 2px; }
      .job { padding: 4px 6px; margin-top: 6px; font-weight: 600; }
      .step { padding: 3px 6px 3px 18px; width: 100%; cursor: pointer; }
      button.job { width: 100%; cursor: pointer; }
      .job .name, .step .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .counts { font-size: 11px; color: var(--orca-muted-foreground); white-space: nowrap; }
      .counts.error { color: var(--orca-destructive); }

      .detail { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .errors-slot:empty { display: none; }
      .errors {
        max-height: 40vh;
        overflow: auto;
        padding: 8px 12px;
        border-bottom: 1px solid var(--orca-border);
      }
      .errors h2 { margin: 0 0 6px; font-size: 13px; color: var(--orca-destructive); }
      .failure { margin-bottom: 8px; }
      .error-rows { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
      .error-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .error-text { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
      .error-row.line .error-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

      .log { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .log-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--orca-border); }
      .search {
        width: 220px;
        max-width: 100%;
        padding: 3px 6px;
        border: 1px solid var(--orca-input);
        border-radius: var(--orca-radius);
        background: var(--orca-background);
      }
      .log-notice { margin: 12px; }
      .log-notice.error { color: var(--orca-destructive); }
      .log-scroller {
        flex: 1;
        min-height: 0;
        overflow: auto;
        font: 12px/18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --ansi-black: var(--orca-muted-foreground);
        --ansi-red: var(--orca-destructive);
        --ansi-green: var(--orca-primary);
        --ansi-yellow: color-mix(in srgb, var(--orca-destructive) 50%, var(--orca-foreground));
        --ansi-blue: var(--orca-ring);
        --ansi-magenta: color-mix(in srgb, var(--orca-destructive) 50%, var(--orca-ring));
        --ansi-cyan: color-mix(in srgb, var(--orca-ring) 50%, var(--orca-foreground));
        --ansi-white: var(--orca-foreground);
      }
      .log-spacer { position: relative; min-width: 100%; width: max-content; }
      .log-rows { position: absolute; top: 0; left: 0; min-width: 100%; }
      .row { height: 18px; white-space: pre; padding-right: 12px; }
      .row .ln {
        display: inline-block;
        min-width: 7ch;
        padding: 0 1ch 0 0;
        margin-right: 1ch;
        text-align: right;
        color: var(--orca-muted-foreground);
        border-right: 1px solid var(--orca-border);
        user-select: none;
      }
      .row.kind-error { background: color-mix(in srgb, var(--orca-destructive) 16%, transparent); }
      .row.kind-error .ln { color: var(--orca-destructive); }
      .row.kind-warning { background: color-mix(in srgb, var(--orca-accent) 50%, transparent); }
      .row.kind-section { font-weight: 600; }
      .row.kind-command .tx { color: var(--orca-ring); }
      .row.kind-debug .tx, .row.kind-endgroup .tx { color: var(--orca-muted-foreground); }
      .row.kind-group .tx::before { content: '▸ '; }
      .row.hit { box-shadow: inset 3px 0 0 var(--orca-ring); }
      .row.current { box-shadow: inset 3px 0 0 var(--orca-ring); background: var(--orca-accent); color: var(--orca-accent-foreground); }

      .b { font-weight: 700; }
      .dim { opacity: 0.7; }
      .i { font-style: italic; }
      .u { text-decoration: underline; }
      .fg-0, .fg-8 { color: var(--ansi-black); }
      .fg-1, .fg-9 { color: var(--ansi-red); }
      .fg-2, .fg-10 { color: var(--ansi-green); }
      .fg-3, .fg-11 { color: var(--ansi-yellow); }
      .fg-4, .fg-12 { color: var(--ansi-blue); }
      .fg-5, .fg-13 { color: var(--ansi-magenta); }
      .fg-6, .fg-14 { color: var(--ansi-cyan); }
      .fg-7, .fg-15 { color: var(--ansi-white); }
      .bg-0, .bg-8 { background: color-mix(in srgb, var(--ansi-black) 30%, transparent); }
      .bg-1, .bg-9 { background: color-mix(in srgb, var(--ansi-red) 30%, transparent); }
      .bg-2, .bg-10 { background: color-mix(in srgb, var(--ansi-green) 30%, transparent); }
      .bg-3, .bg-11 { background: color-mix(in srgb, var(--ansi-yellow) 30%, transparent); }
      .bg-4, .bg-12 { background: color-mix(in srgb, var(--ansi-blue) 30%, transparent); }
      .bg-5, .bg-13 { background: color-mix(in srgb, var(--ansi-magenta) 30%, transparent); }
      .bg-6, .bg-14 { background: color-mix(in srgb, var(--ansi-cyan) 30%, transparent); }
      .bg-7, .bg-15 { background: color-mix(in srgb, var(--ansi-white) 30%, transparent); }

      @media (max-width: 720px) {
        .split { flex-direction: column; }
        .steps { width: auto; max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--orca-border); }
        .errors { max-height: 30vh; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./run.ts"></script>
  </body>
</html>
