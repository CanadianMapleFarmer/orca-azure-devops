<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Azure DevOps board</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--orca-background);
        color: var(--orca-foreground);
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      #app { position: relative; display: flex; flex-direction: column; height: 100vh; }
      [hidden] { display: none !important; }
      .muted { color: var(--orca-muted-foreground); }
      select, button, input, textarea { font: inherit; color: inherit; }
      select {
        background: var(--orca-background);
        color: var(--orca-foreground);
        border: 1px solid var(--orca-input);
        border-radius: var(--orca-radius);
        padding: 3px 6px;
        max-width: 280px;
      }
      button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: 1px; }
      .button {
        align-self: flex-start;
        border: 0;
        border-radius: var(--orca-radius);
        padding: 5px 12px;
        background: var(--orca-primary);
        color: var(--orca-primary-foreground);
        cursor: pointer;
      }
      .button.secondary { background: var(--orca-secondary); color: var(--orca-secondary-foreground); }
      .button:disabled { opacity: 0.5; cursor: default; }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--orca-border);
      }
      .title { font-weight: 600; }
      .toolbar .muted { margin-right: auto; }
      .segmented { display: inline-flex; border: 1px solid var(--orca-input); border-radius: var(--orca-radius); overflow: hidden; }
      .segmented button { border: 0; background: transparent; padding: 3px 10px; cursor: pointer; }
      .segmented button[aria-pressed='true'] { background: var(--orca-secondary); color: var(--orca-secondary-foreground); }

      .banner {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 12px 0;
        padding: 8px 10px;
        border-radius: var(--orca-radius);
        background: var(--orca-destructive);
        color: var(--orca-destructive-foreground);
      }
      .banner span { flex: 1; }
      .note { margin: 6px 12px 0; }

      .body { position: relative; display: flex; flex: 1; min-height: 0; }
      .board { flex: 1; min-width: 0; overflow: auto; padding: 0 12px 12px; }
      .board:focus { outline: none; }
      .board:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -2px; }
      .board > p { margin: 16px 0; }
      .grid {
        display: grid;
        grid-template-columns: repeat(var(--columns, 1), minmax(220px, 1fr));
        gap: 8px;
        min-width: min-content;
      }
      .column-head {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 10px 4px 6px;
        font-weight: 600;
        background: var(--orca-background);
        border-bottom: 2px solid var(--orca-border);
      }
      .lane-head {
        grid-column: 1 / -1;
        text-align: left;
        border: 0;
        border-radius: var(--orca-radius);
        padding: 4px 8px;
        background: var(--orca-muted);
        cursor: pointer;
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 64px;
        padding: 6px;
        border-radius: var(--orca-radius);
        background: color-mix(in srgb, var(--orca-muted) 55%, transparent);
      }
      .cell.drop { outline: 2px dashed var(--orca-ring); outline-offset: -2px; }

      .card {
        padding: 8px;
        border: 1px solid var(--orca-border);
        border-radius: var(--orca-radius);
        background: var(--orca-card);
        color: var(--orca-card-foreground);
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .card:focus-visible { outline: 2px solid var(--orca-ring); outline-offset: 1px; }
      .card.selected { border-color: var(--orca-ring); box-shadow: inset 3px 0 0 var(--orca-ring); }
      .card.dragging { opacity: 0.4; }
      .card.busy { opacity: 0.6; cursor: progress; }
      .card.ghost {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        cursor: grabbing;
        box-shadow: 0 8px 20px color-mix(in srgb, var(--orca-foreground) 25%, transparent);
      }
      .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; color: var(--orca-muted-foreground); }
      .who {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        border-radius: 11px;
        font-size: 10px;
        font-weight: 600;
        background: var(--orca-accent);
        color: var(--orca-accent-foreground);
      }
      .card-title { margin-top: 4px; overflow-wrap: anywhere; }
      .parent { margin-top: 4px; font-size: 12px; color: var(--orca-muted-foreground); overflow-wrap: anywhere; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .chip { padding: 0 6px; border: 1px solid var(--orca-border); border-radius: 9px; font-size: 11px; color: var(--orca-muted-foreground); }
      .chip.success { border-color: var(--orca-primary); color: var(--orca-foreground); }
      .chip.warning { border-color: var(--orca-accent); background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .chip.danger { border-color: var(--orca-destructive); color: var(--orca-destructive); }

      .picker {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(420px, calc(100% - 32px));
        margin: 32px auto;
        padding: 16px;
        border: 1px solid var(--orca-border);
        border-radius: var(--orca-radius);
        background: var(--orca-card);
        color: var(--orca-card-foreground);
      }
      .picker h1 { margin: 0; font-size: 15px; }
      .picker p { margin: 0; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field select { max-width: none; }

      .panel {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        width: clamp(360px, 40%, 560px);
        min-height: 0;
        border-left: 1px solid var(--orca-border);
        background: var(--orca-popover);
        color: var(--orca-popover-foreground);
        box-shadow: -8px 0 24px color-mix(in srgb, var(--orca-foreground) 8%, transparent);
      }
      @media (prefers-reduced-motion: no-preference) {
        .panel { animation: slide-in 160ms ease-out; }
        @keyframes slide-in { from { transform: translateX(16px); opacity: 0; } }
      }
      @media (max-width: 759px) {
        .panel { position: absolute; inset: 0; width: auto; border-left: 0; box-shadow: none; }
      }

      .panel-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--orca-border); }
      .panel-kicker { display: flex; align-items: center; gap: 4px; color: var(--orca-muted-foreground); font-size: 12px; }
      .panel-kicker span { margin-right: auto; }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: var(--orca-radius);
        background: transparent;
        color: var(--orca-muted-foreground);
        cursor: pointer;
      }
      .icon-button:hover { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .icon-button svg { width: 16px; height: 16px; }
      .panel-title { margin: 2px 0 2px; font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
      .panel-title:focus { outline: none; }
      .panel-meta { font-size: 12px; color: var(--orca-muted-foreground); }

      .panel-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 14px 16px; }
      .fields { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--orca-border); }
      .fields > span { color: var(--orca-muted-foreground); }
      .fields select { max-width: 220px; justify-self: start; }
      .assignee {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        justify-self: start;
        border: 1px solid var(--orca-input);
        border-radius: var(--orca-radius);
        padding: 2px 8px 2px 3px;
        background: var(--orca-background);
        cursor: pointer;
      }
      .assignee .who { min-width: 20px; height: 20px; font-size: 9px; }
      .assignee svg { width: 12px; height: 12px; color: var(--orca-muted-foreground); }
      .fields .notice { grid-column: 1 / -1; }
      .anchor { position: relative; justify-self: start; }

      .assignee-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        z-index: 4;
        width: 280px;
        padding: 6px;
        border: 1px solid var(--orca-border);
        border-radius: var(--orca-radius);
        background: var(--orca-popover);
        box-shadow: 0 8px 24px color-mix(in srgb, var(--orca-foreground) 16%, transparent);
      }
      .assignee-menu input {
        width: 100%;
        padding: 5px 8px;
        border: 1px solid var(--orca-input);
        border-radius: var(--orca-radius);
        background: var(--orca-background);
      }
      .assignee-menu ul { list-style: none; margin: 6px 0 0; padding: 0; }
      .assignee-menu li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: var(--orca-radius); cursor: pointer; }
      .assignee-menu li[aria-selected='true'] { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .assignee-menu li small { margin-left: auto; color: var(--orca-muted-foreground); }
      .assignee-menu .group { padding: 6px 6px 2px; font-size: 12px; color: var(--orca-muted-foreground); }
      .assignee-menu .search-row { border-top: 1px solid var(--orca-border); margin-top: 4px; padding-top: 7px; border-radius: 0; }

      .section { border-bottom: 1px solid var(--orca-border); padding: 4px 0 12px; }
      .section:last-child { border-bottom: 0; }
      .section-head {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 8px 0 6px;
        border: 0;
        background: transparent;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .section-head svg { width: 12px; height: 12px; color: var(--orca-muted-foreground); }
      .section-head .count { font-weight: 400; color: var(--orca-muted-foreground); }
      .section-head .progress { margin-left: auto; }
      .progress { display: inline-block; width: 96px; height: 4px; border-radius: 2px; background: var(--orca-muted); overflow: hidden; }
      .progress > i { display: block; height: 100%; background: var(--orca-primary); }

      .rich { max-width: 68ch; }
      .rich p { margin: 0 0 8px; }
      .rich ul, .rich ol { margin: 0 0 8px; padding-left: 20px; }
      .rich li { margin: 2px 0; }
      .rich code { padding: 0 4px; border-radius: 4px; background: var(--orca-muted); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .rich a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
      .empty { margin: 0; color: var(--orca-muted-foreground); }
      a[role='link'] { cursor: pointer; color: inherit; text-decoration: underline; text-underline-offset: 2px; }
      .badge { justify-self: end; padding: 0 6px; border: 1px solid var(--orca-border); border-radius: 9px; font-size: 11px; color: var(--orca-muted-foreground); white-space: nowrap; }
      .task .type { color: var(--orca-muted-foreground); margin-right: 4px; }

      .tasks { list-style: none; margin: 0; padding: 0; }
      .task { display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 8px; padding: 4px 0; }
      .task input { width: 15px; height: 15px; margin: 0; accent-color: var(--orca-primary); cursor: pointer; }
      .task .task-title { overflow-wrap: anywhere; }
      .task.done .task-title { color: var(--orca-muted-foreground); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--orca-muted-foreground) 60%, transparent); }
      .task .who { min-width: 20px; height: 20px; font-size: 9px; }
      .task .state { font-size: 12px; color: var(--orca-muted-foreground); min-width: 72px; text-align: right; }
      .task.busy { opacity: 0.6; }
      .more { display: inline-block; margin: 4px 0 0 23px; font-size: 12px; color: var(--orca-muted-foreground); }
      .add-task { display: flex; gap: 6px; margin-top: 8px; padding-left: 23px; }
      .add-task input, .composer textarea {
        flex: 1;
        min-width: 0;
        padding: 5px 8px;
        border: 1px solid var(--orca-input);
        border-radius: var(--orca-radius);
        background: var(--orca-background);
      }

      .prs { list-style: none; margin: 0; padding: 0; }
      .pr { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 6px 8px; margin: 0 -8px; border-radius: var(--orca-radius); cursor: pointer; }
      .pr:hover { background: var(--orca-muted); }
      .pr .pr-id { color: var(--orca-muted-foreground); font-variant-numeric: tabular-nums; }
      .pr .pr-title { overflow-wrap: anywhere; }
      .pr .chips { grid-column: 2; margin-top: 2px; }
      .pr .pr-title .target { margin-left: 4px; }
      .pr .target { font-size: 12px; color: var(--orca-muted-foreground); }

      .composer { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
      .composer textarea { resize: vertical; min-height: 60px; }
      .composer .row { display: flex; align-items: center; gap: 8px; }
      .composer .row .muted { font-size: 12px; }
      .comment { padding: 8px 0; border-top: 1px solid var(--orca-border); }
      .comment .by { font-size: 12px; color: var(--orca-muted-foreground); margin-bottom: 2px; }
      .comment .by strong { color: var(--orca-foreground); font-weight: 600; }

      .notice { margin: 8px 0 0; padding: 7px 10px; border-radius: var(--orca-radius); border: 1px solid var(--orca-border); background: var(--orca-muted); }
      .notice.danger { border-color: var(--orca-destructive); background: color-mix(in srgb, var(--orca-destructive) 10%, var(--orca-popover)); }
      .notice.accent { border-color: var(--orca-accent); background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .notice.success { border-color: var(--orca-primary); background: transparent; }
      .notice .button { margin-top: 6px; }

      .panel-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-top: 1px solid var(--orca-border); background: var(--orca-popover); }
      .panel-foot a { color: var(--orca-foreground); text-underline-offset: 2px; }
      .panel-foot .notice { flex-basis: 100%; margin: 0; }
      .panel-foot .muted, .panel-foot .choice { flex-basis: 100%; margin: 0; }
      .choice { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
      .choice .repo { align-self: center; overflow-wrap: anywhere; }
      .choice .field, .choice .field select { max-width: 100%; }

      .skeleton { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; }
      .skeleton i { display: block; height: 10px; border-radius: 5px; background: var(--orca-muted); }
      @media (prefers-reduced-motion: no-preference) {
        .skeleton i { animation: pulse 1.2s ease-in-out infinite alternate; }
        @keyframes pulse { to { opacity: 0.45; } }
      }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      .slot { display: contents; }
      .off-board { margin: 12px 0 0; }
      .fields .notice-slot { grid-column: 1 / -1; }
      .field-value { display: inline-flex; align-items: center; gap: 6px; justify-self: start; }
      .section-head[aria-expanded='false'] svg { transform: rotate(-90deg); }
      .task.read-only { grid-template-columns: 1fr auto auto auto; }
      .prs a[role='link'] { text-decoration: none; }
      .pr .pr-title:first-child { grid-column: 1 / -1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./board.ts"></script>
  </body>
</html>
